#:schema node_modules/wrangler/config-schema.json
name = "evo-app"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "dist"}
upload_source_maps = true



[[d1_databases]]
binding = "DB" # доступно как env.DB
database_name = "d1-bot"
database_id = "0c434bad-9113-4689-9a49-becf4304330b"

migrations_dir = "./drizzle"



[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2"
bucket_name = "evotor"
preview_bucket_name = "evotor"





# Секреты НЕ хранить в [vars]: задаются через `wrangler secret put` (prod)
# или через .dev.vars (локально, gitignored). Полный список — в SECRETS.md.
[vars]
# Несекретный публичный URL R2-бакета (отдаётся клиенту)
R2_PUBLIC_URL = "c1e9f63e6135bb4fa5600e83bf4a1a4b.r2.cloudflarestorage.com/evotor"

