<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нет соединения — Evo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; background: #f9fafb; color: #333; text-align: center; padding: 20px;
    }
    .offline { max-width: 400px; }
    h1 { font-size: 48px; margin: 0 0 10px; }
    h2 { font-size: 20px; margin: 0 0 8px; }
    p { color: #666; font-size: 14px; }
    button {
      margin-top: 20px; padding: 10px 24px; border-radius: 8px; border: none;
      background: #007aff; color: white; font-size: 16px; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #080c16; color: #e5e7eb; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <div class="offline">
    <h1>📡</h1>
    <h2>Нет соединения</h2>
    <p>Проверьте подключение к интернету и попробуйте снова.</p>
    <button onclick="window.location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
